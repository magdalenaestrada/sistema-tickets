<style>
    /* Color por defecto (libre) */
    .seat-body,
    .seat-base,
    .armrest {
        fill: #95a5a6; /* Gris para libre */
    }

    .seat-body,
    .seat-base {
        stroke: #2a2a2a;
        stroke-width: 3;
    }
    .armrest {
        stroke: #2a2a2a;
        stroke-width: 2;
    }

    /* Estados */
    .seat.ocupado .seat-body,
    .seat.ocupado .seat-base,
    .seat.ocupado .armrest {
        fill: #e74c3c !important; /* Rojo */
    }

    .seat.reservado .seat-body,
    .seat.reservado .seat-base,
    .seat.reservado .armrest {
        fill: #f39c12 !important; /* Naranja */
    }

    .seat.selected-seat .seat-body,
    .seat.selected-seat .seat-base,
    .seat.selected-seat .armrest {
        fill: #3498db !important; /* Azul */
    }

    .seat-text {
        font-family: sans-serif;
        font-size: 22px;
        font-weight: bold;
        pointer-events: none;
        fill: #000;
    }

    .seat {
        transition: transform 0.1s ease, fill 0.2s ease;
        cursor: pointer;
    }

    .seat:hover {
        filter: brightness(1.1);
    }
</style>
